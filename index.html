<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CRM">

  <title>CAOS 거래처 관리 시스템</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .btn-primary {
      background: #e50012;
      color: white;
    }

    .btn-secondary {
      background: white;
      color: #263244;
      border: 1px solid #d8dde6;
    }

    .btn-danger {
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 12px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: white;
      border: 1px solid #e2e6ec;
      border-radius: 14px;
      padding: 15px;
    }

    .summary-label {
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 23px;
      font-weight: 800;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 8px;
      background: white;
      border: 1px solid #e2e6ec;
      border-radius: 14px;
      padding: 12px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #ccd3dd;
      border-radius: 9px;
      padding: 10px;
      background: white;
      color: #172033;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #e5001222;
      border-color: #e50012;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .connection {
      margin: 10px 2px 0;
      font-size: 12px;
      color: #64748b;
      word-break: break-word;
    }

    .connection.ok {
      color: #047857;
    }

    .connection.error {
      color: #b91c1c;
    }

    .client-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .client-card {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
      transition: 0.15s;
    }

    .client-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    .client-name {
      font-size: 18px;
      font-weight: 800;
      margin: 9px 0 5px;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }

    .badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #475569;
      font-size: 11px;
      font-weight: 800;
    }

    .badge.ACTIVE {
      background: #ecfdf5;
      color: #047857;
    }

    .badge.PROSPECT {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .badge.INACTIVE {
      background: #f1f5f9;
      color: #64748b;
    }

    .product-preview {
      border-top: 1px solid #edf0f3;
      margin-top: 10px;
      padding-top: 8px;
      font-size: 12px;
    }

    .row-between {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .empty {
      grid-column: 1 / -1;
      background: white;
      border: 1px solid #e2e6ec;
      border-radius: 14px;
      padding: 50px 15px;
      text-align: center;
      color: #94a3b8;
    }

    dialog {
      width: min(720px, 94vw);
      max-height: 92vh;
      padding: 0;
      border: 0;
      border-radius: 17px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.3);
    }

    dialog::backdrop {
      background: rgba(0,0,0,0.55);
    }

    .modal {
      padding: 18px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .product-row {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 7px;
      margin-bottom: 7px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .detail-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 15px;
    }

    .detail-section {
      margin-top: 18px;
    }

    .detail-section h3 {
      margin: 0 0 9px;
      font-size: 16px;
    }

    .detail-product {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #edf0f3;
    }

    .order-card {
      border: 1px solid #e5e7eb;
      border-radius: 11px;
      padding: 11px;
      margin-bottom: 8px;
    }

    .order-title {
      font-weight: 800;
    }

    .order-info {
      color: #64748b;
      font-size: 12px;
      margin-top: 5px;
    }

    @media (max-width: 850px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar .search {
        grid-column: 1 / -1;
      }

      .client-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      .container {
        padding: 12px;
      }

      .title {
        font-size: 21px;
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .summary-value {
        font-size: 20px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .toolbar .search {
        grid-column: auto;
      }

      .client-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .product-row {
        grid-template-columns: 1fr;
      }

      .header-buttons {
        width: 100%;
      }

      .header-buttons .btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <h1 class="title">CAOS 거래처 관리 시스템</h1>
      <div class="subtitle">
        PC와 iPhone에서 동일한 Supabase 데이터를 사용합니다.
      </div>
    </div>

    <div class="header-buttons">
      <button class="btn btn-secondary" id="csvBtn">
        CSV 내보내기
      </button>

      <button class="btn btn-primary" id="newClientBtn">
        + 신규 거래처
      </button>
    </div>
  </div>


  <div class="summary">

    <div class="summary-card">
      <div class="summary-label">전체 거래처</div>
      <div class="summary-value" id="totalClients">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">활성 거래처</div>
      <div class="summary-value" id="activeClients">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">전체 주문</div>
      <div class="summary-value" id="totalOrders">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">총 주문금액</div>
      <div class="summary-value" id="totalAmount">$0.00</div>
    </div>

  </div>


  <div class="toolbar">

    <input
      class="search"
      id="searchInput"
      placeholder="거래처명, 국가, 담당자, 이메일, 전화번호, 제품 검색"
    >

    <select id="countryFilter">
      <option value="">전체 국가</option>
    </select>

    <select id="statusFilter">
      <option value="">전체 상태</option>
      <option value="ACTIVE">활성 거래중</option>
      <option value="PROSPECT">계약 협상중</option>
      <option value="INACTIVE">거래 중단/휴면</option>
    </select>

    <button class="btn btn-secondary" id="refreshBtn">
      새로고침
    </button>

  </div>


  <div class="connection" id="connectionStatus">
    Supabase 연결 중...
  </div>


  <div class="client-grid" id="clientGrid"></div>

</div>


<!-- 거래처 등록 / 수정 -->

<dialog id="clientDialog">

  <form class="modal" id="clientForm">

    <div class="modal-header">

      <h2 id="clientModalTitle">
        신규 거래처
      </h2>

      <button
        type="button"
        class="btn btn-secondary"
        id="closeClientDialog"
      >
        닫기
      </button>

    </div>


    <input type="hidden" id="clientId">


    <div class="form-grid">

      <div>
        <label for="clientName">거래처명 *</label>
        <input id="clientName" required>
      </div>

      <div>
        <label for="clientCountry">국가 *</label>
        <input id="clientCountry" required>
      </div>

      <div>
        <label for="clientManager">담당자 *</label>
        <input id="clientManager" required>
      </div>

      <div>
        <label for="clientStatus">거래상태</label>

        <select id="clientStatus">
          <option value="ACTIVE">활성 거래중</option>
          <option value="PROSPECT">계약 협상중</option>
          <option value="INACTIVE">거래 중단/휴면</option>
        </select>
      </div>

      <div>
        <label for="clientEmail">이메일</label>
        <input id="clientEmail" type="email">
      </div>

      <div>
        <label for="clientPhone">전화번호</label>
        <input id="clientPhone">
      </div>

      <div class="full">
        <label for="clientNotes">메모</label>
        <textarea id="clientNotes"></textarea>
      </div>

      <div class="full">

        <label>판매 제품</label>

        <div id="productRows"></div>

        <button
          type="button"
          class="btn btn-secondary btn-small"
          id="addProductBtn"
        >
          + 제품 추가
        </button>

      </div>

    </div>


    <div class="modal-actions">

      <button
        type="button"
        class="btn btn-danger"
        id="deleteClientBtn"
        style="margin-right:auto;display:none;"
      >
        거래처 삭제
      </button>

      <button
        type="button"
        class="btn btn-secondary"
        id="cancelClientBtn"
      >
        취소
      </button>

      <button
        type="submit"
        class="btn btn-primary"
      >
        저장
      </button>

    </div>

  </form>

</dialog>


<!-- 거래처 상세 -->

<dialog id="detailDialog">

  <div class="modal">

    <div class="modal-header">

      <h2 id="detailTitle">
        거래처 상세
      </h2>

      <button
        class="btn btn-secondary"
        id="closeDetailDialog"
      >
        닫기
      </button>

    </div>


    <div id="detailContent"></div>


    <div class="modal-actions">

      <button
        class="btn btn-secondary"
        id="editClientBtn"
      >
        거래처 수정
      </button>

      <button
        class="btn btn-primary"
        id="newOrderBtn"
      >
        + 주문 등록
      </button>

    </div>

  </div>

</dialog>


<!-- 주문 등록 -->

<dialog id="orderDialog">

  <form class="modal" id="orderForm">

    <div class="modal-header">

      <h2>주문 등록</h2>

      <button
        type="button"
        class="btn btn-secondary"
        id="closeOrderDialog"
      >
        닫기
      </button>

    </div>


    <div class="form-grid">

      <div class="full">

        <label for="orderItem">
          제품명 *
        </label>

        <input
          id="orderItem"
          list="productList"
          required
        >

        <datalist id="productList"></datalist>

      </div>


      <div>

        <label for="orderQty">
          수량 *
        </label>

        <input
          id="orderQty"
          type="number"
          min="1"
          value="1"
          required
        >

      </div>


      <div>

        <label for="orderPrice">
          단가 ($)
        </label>

        <input
          id="orderPrice"
          type="number"
          min="0"
          step="0.01"
          value="0"
        >

      </div>


      <div>

        <label for="orderDate">
          주문일
        </label>

        <input
          id="orderDate"
          type="date"
          required
        >

      </div>


      <div>

        <label for="orderStatus">
          주문상태
        </label>

        <select id="orderStatus">
          <option value="진행중">진행중</option>
          <option value="발송완료">발송완료</option>
          <option value="결제완료">결제완료</option>
        </select>

      </div>

    </div>


    <div class="modal-actions">

      <button
        type="button"
        class="btn btn-secondary"
        id="cancelOrderBtn"
      >
        취소
      </button>

      <button
        type="submit"
        class="btn btn-primary"
      >
        주문 저장
      </button>

    </div>

  </form>

</dialog>


<script>

const SUPABASE_URL =
  "https://schiczeuqeclmhibpzwl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wCtIHl_y2y8drElaoK68qA__ofb6th6";


const $ = id =>
  document.getElementById(id);


let db = null;

let clients = [];

let selectedClientId = null;



function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character])
    );

}



function formatMoney(value) {

  return Number(value || 0)
    .toLocaleString(
      "en-US",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}



function statusText(status) {

  const names = {
    ACTIVE: "활성 거래중",
    PROSPECT: "계약 협상중",
    INACTIVE: "거래 중단/휴면"
  };

  return names[status] || status;

}



function setConnection(message, type = "") {

  const el = $("connectionStatus");

  el.textContent = message;

  el.className =
    "connection" +
    (type ? " " + type : "");

}



function todayLocal() {

  const d = new Date();

  const year = d.getFullYear();

  const month =
    String(d.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(d.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;

}



function initializeSupabase() {

  if (!window.supabase) {

    setConnection(
      "오류: Supabase JavaScript 라이브러리를 불러오지 못했습니다.",
      "error"
    );

    return false;

  }


  try {

    db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: false
          }
        }
      );


    return true;

  }

  catch (error) {

    console.error(error);

    setConnection(
      "Supabase 초기화 오류: " +
      (error.message || String(error)),
      "error"
    );

    return false;

  }

}



async function loadData() {

  if (!db) {

    setConnection(
      "Supabase가 초기화되지 않았습니다.",
      "error"
    );

    return;

  }


  setConnection(
    "Supabase에서 데이터를 불러오는 중..."
  );


  try {

    const clientResult =
      await db
        .from("clients")
        .select("*")
        .order(
          "name",
          { ascending: true }
        );


    if (clientResult.error) {

      throw clientResult.error;

    }


    const productResult =
      await db
        .from("products")
        .select("*");


    if (productResult.error) {

      throw productResult.error;

    }


    const orderResult =
      await db
        .from("orders")
        .select("*")
        .order(
          "order_date",
          { ascending: false }
        );


    if (orderResult.error) {

      throw orderResult.error;

    }


    const productRows =
      productResult.data || [];


    const orderRows =
      orderResult.data || [];


    clients =
      (clientResult.data || [])
        .map(client => ({

          ...client,

          products:
            productRows
              .filter(
                product =>
                  product.client_id === client.id
              )
              .sort(
                (a, b) =>
                  String(a.name || "")
                    .localeCompare(
                      String(b.name || "")
                    )
              ),

          orders:
            orderRows
              .filter(
                order =>
                  order.client_id === client.id
              )

        }));


    updateSummary();

    updateCountryFilter();

    renderClients();


    setConnection(
      `연결됨 · 거래처 ${clients.length}개 · 마지막 갱신 ${new Date().toLocaleTimeString()}`,
      "ok"
    );

  }

  catch (error) {

    console.error(
      "Supabase load error:",
      error
    );


    let message =
      error?.message ||
      String(error);


    if (error?.details) {

      message +=
        " / " +
        error.details;

    }


    if (error?.hint) {

      message +=
        " / " +
        error.hint;

    }


    if (error?.code) {

      message +=
        " / code: " +
        error.code;

    }


    setConnection(
      "연결 오류: " + message,
      "error"
    );

  }

}



function updateSummary() {

  const totalClients =
    clients.length;


  const activeClients =
    clients.filter(
      client =>
        client.status === "ACTIVE"
    ).length;


  const orders =
    clients.flatMap(
      client =>
        client.orders || []
    );


  const totalAmount =
    orders.reduce(
      (sum, order) =>
        sum +
        Number(
          order.total_amount || 0
        ),
      0
    );


  $("totalClients").textContent =
    totalClients;


  $("activeClients").textContent =
    activeClients;


  $("totalOrders").textContent =
    orders.length;


  $("totalAmount").textContent =
    "$" + formatMoney(totalAmount);

}



function updateCountryFilter() {

  const select =
    $("countryFilter");


  const previousValue =
    select.value;


  const countries =
    [...new Set(
      clients
        .map(
          client =>
            client.country
        )
        .filter(Boolean)
    )]
    .sort();


  select.innerHTML =
    '<option value="">전체 국가</option>' +
    countries
      .map(
        country =>
          `<option value="${escapeHtml(country)}">${escapeHtml(country)}</option>`
      )
      .join("");


  if (
    countries.includes(
      previousValue
    )
  ) {

    select.value =
      previousValue;

  }

}



function getFilteredClients() {

  const keyword =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();


  const country =
    $("countryFilter").value;


  const status =
    $("statusFilter").value;


  return clients.filter(
    client => {

      const searchable =
        [
          client.name,
          client.country,
          client.manager,
          client.email,
          client.phone,
          client.notes,

          ...(client.products || [])
            .map(
              product =>
                product.name
            )

        ]
        .join(" ")
        .toLowerCase();


      const keywordMatch =
        !keyword ||
        searchable.includes(
          keyword
        );


      const countryMatch =
        !country ||
        client.country === country;


      const statusMatch =
        !status ||
        client.status === status;


      return (
        keywordMatch &&
        countryMatch &&
        statusMatch
      );

    }
  );

}



function renderClients() {

  const list =
    getFilteredClients();


  if (!list.length) {

    $("clientGrid").innerHTML =
      `
        <div class="empty">
          등록된 거래처가 없습니다.
        </div>
      `;

    return;

  }


  $("clientGrid").innerHTML =
    list
      .map(
        client => {

          const products =
            client.products || [];


          return `

            <div
              class="client-card"
              data-client-id="${client.id}"
            >

              <div class="badges">

                <span class="badge">
                  ${escapeHtml(client.country)}
                </span>

                <span class="badge ${escapeHtml(client.status)}">
                  ${escapeHtml(statusText(client.status))}
                </span>

              </div>


              <div class="client-name">
                ${escapeHtml(client.name)}
              </div>


              <div class="muted">
                담당자:
                ${escapeHtml(client.manager || "-")}
              </div>


              <div class="muted">
                ${escapeHtml(client.email || "")}
              </div>


              <div class="muted">
                ${escapeHtml(client.phone || "")}
              </div>


              <div class="product-preview">

                ${
                  products.length

                  ?

                  products
                    .slice(0, 3)
                    .map(
                      product => `

                        <div class="row-between">

                          <span>
                            ${escapeHtml(product.name)}
                          </span>

                          <strong>
                            $${formatMoney(product.price)}
                          </strong>

                        </div>

                      `
                    )
                    .join("")

                  :

                  '<span class="muted">등록 제품 없음</span>'
                }

              </div>


              <div
                class="muted"
                style="margin-top:9px;"
              >
                주문
                ${(client.orders || []).length}건
              </div>

            </div>

          `;

        }
      )
      .join("");


  document
    .querySelectorAll(
      ".client-card"
    )
    .forEach(
      card => {

        card.addEventListener(
          "click",
          () => {

            openClientDetail(
              card.dataset.clientId
            );

          }
        );

      }
    );

}



function addProductRow(
  name = "",
  price = ""
) {

  const row =
    document.createElement("div");


  row.className =
    "product-row";


  row.innerHTML =
    `

      <input
        class="product-name"
        placeholder="제품명"
        value="${escapeHtml(name)}"
      >

      <input
        class="product-price"
        type="number"
        min="0"
        step="0.01"
        placeholder="단가"
        value="${escapeHtml(price)}"
      >

      <button
        type="button"
        class="btn btn-danger btn-small"
      >
        삭제
      </button>

    `;


  row
    .querySelector("button")
    .addEventListener(
      "click",
      () => {

        row.remove();

      }
    );


  $("productRows")
    .appendChild(row);

}



function openNewClient() {

    null;


  $("clientForm").reset();


  $("clientId").value =
    "";


  $("clientModalTitle").textContent =
    "신규 거래처 등록";


  $("clientStatus").value =
    "PROSPECT";


  $("productRows").innerHTML =
    "";


  addProductRow();


  $("deleteClientBtn").style.display =
    "none";

}



function openEditClient() {

  const client =
    clients.find(
      item =>
        item.id === selectedClientId
    );


  if (!client) {

    return;

  }


  $("detailDialog").close();


  $("clientId").value =
    client.id;


  $("clientName").value =
    client.name || "";


  $("clientCountry").value =
    client.country || "";


  $("clientManager").value =
    client.manager || "";


  $("clientStatus").value =
    client.status || "PROSPECT";


  $("clientEmail").value =
    client.email || "";


  $("clientPhone").value =
    client.phone || "";


  $("clientNotes").value =
    client.notes || "";


  $("clientModalTitle").textContent =
    "거래처 수정";


  $("productRows").innerHTML =
    "";


  if (
    (client.products || []).length
  ) {

    client.products.forEach(
      product => {

        addProductRow(
          product.name,
          product.price
        );

    );

  }

  else {

    addProductRow();

  }

    "block";


  $("clientDialog").showModal();

}



async function saveClient(event) {

  event.preventDefault();


  const existingId =
    $("clientId").value;


  const clientData = {

    name:
      $("clientName")
        .value
        .trim(),

    country:
      $("clientCountry")
        .value
        .trim(),

    manager:
      $("clientManager")
        .value
        .trim(),

    status:
      $("clientStatus").value,

    email:
      $("clientEmail")
        .value
        .trim(),

    phone:
      $("clientPhone")
        .value
        .trim(),

    notes:
      $("clientNotes")
        .value
        .trim()

  };


  const productData =
    [...document.querySelectorAll(
      ".product-row"
    )]
    .map(
      row => ({

        name:
          row
            .querySelector(
              ".product-name"
            )
            .value
            .trim(),

        price:
          Number(
            row
              .querySelector(
                ".product-price"
              )
              .value || 0
          )

      })
    )
    .filter(
      product =>
        product.name
    );


  try {

    let clientId =
      existingId;


    if (existingId) {

      const updateResult =
        await db
          .from("clients")
          .update(clientData)
          .eq(
            "id",
            existingId
          );


      if (updateResult.error) {

        throw updateResult.error;

      }


      const deleteProductsResult =
        await db
          .from("products")
          .delete()
          .eq(
            "client_id",
            existingId
          );


      if (
        deleteProductsResult.error
      ) {

        throw deleteProductsResult.error;

      }

    }

    else {

      const insertResult =
        await db
          .from("clients")
          .insert(clientData)
          .select()
          .single();


      if (insertResult.error) {

        throw insertResult.error;

      }


      clientId =
        insertResult.data.id;

    }


    if (productData.length) {

      const rows =
        productData.map(
          product => ({

            client_id:
              clientId,

            name:
              product.name,

            price:
              product.price

          })
        );


      const productInsertResult =
        await db
          .from("products")
          .insert(rows);


      if (
        productInsertResult.error
      ) {

        throw productInsertResult.error;

      }

    }


    $("clientDialog").close();


    await loadData();

  }

  catch (error) {

    console.error(error);

    alert(
      "저장 오류: " +
      (
        error.message ||
        String(error)
      )
    );

  }

}



async function deleteClient() {

  const id =
    $("clientId").value;


  if (!id) {

    return;

  }


  const client =
    clients.find(
      item =>
        item.id === id
    );


  const name =
    client?.name ||
    "이 거래처";


  if (
    !confirm(
      `${name}을(를) 삭제하시겠습니까?\n관련 제품과 주문도 함께 삭제됩니다.`
    )
  ) {

    return;

  }


  try {

    const result =
      await db
        .from("clients")
        .delete()
        .eq(
          "id",
          id
        );


    if (result.error) {

      throw result.error;

    }


    $("clientDialog").close();


    if (
      $("detailDialog").open
    ) {

      $("detailDialog").close();

    }


    selectedClientId =
      null;


    await loadData();

  }

  catch (error) {

    console.error(error);

    alert(
      "삭제 오류: " +
      (
        error.message ||
        String(error)
      )
    );

  }

}



function openClientDetail(id) {

  const client =
    clients.find(
      item =>
        item.id === id
    );


  if (!client) {

    return;

  }


  selectedClientId =
    id;


  $("detailTitle").textContent =
    client.name;


  const products =
    client.products || [];


  const orders =
    client.orders || [];


  $("detailContent").innerHTML =
    `

      <div class="detail-box">

        <div class="badges">

          <span class="badge">
            ${escapeHtml(client.country)}
          </span>

          <span class="badge ${escapeHtml(client.status)}">
            ${escapeHtml(statusText(client.status))}
          </span>

        </div>


        <p>
          <strong>담당자:</strong>
          ${escapeHtml(client.manager || "-")}
        </p>


        <p>
          <strong>이메일:</strong>
          ${escapeHtml(client.email || "-")}
        </p>


        <p>
          <strong>전화:</strong>
          ${escapeHtml(client.phone || "-")}
        </p>


        <p>
          <strong>메모:</strong><br>
          ${escapeHtml(client.notes || "메모 없음")}
        </p>

      </div>


      <div class="detail-section">

        <h3>
          취급 / 판매 제품
        </h3>


        ${
          products.length

          ?

          products
            .map(
              product => `

                <div class="detail-product">

                  <span>
                    ${escapeHtml(product.name)}
                  </span>

                  <strong>
                    $${formatMoney(product.price)}
                  </strong>

                </div>

              `
            )
            .join("")

          :

          '<div class="muted">등록된 제품이 없습니다.</div>'
        }

      </div>


      <div class="detail-section">

        <h3>
          주문 내역
        </h3>


        ${
          orders.length

          ?

          orders
            .map(
              order => `

                <div class="order-card">

                  <div class="row-between">

                    <div class="order-title">
                      ${escapeHtml(order.item_name)}
                    </div>

                    <strong>
                      $${formatMoney(order.total_amount)}
                    </strong>

                  </div>


                  <div class="order-info">

                    ${escapeHtml(order.order_date)}

                    ·

                    ${Number(order.quantity || 0)}개

                    ×

                    $${formatMoney(order.unit_price)}

                    ·

                    ${escapeHtml(order.status)}

                  </div>


                  <div style="margin-top:8px;">

                    <button
                      class="btn btn-danger btn-small delete-order-btn"
                      data-order-id="${order.id}"
                    >
                      주문 삭제
                    </button>

                  </div>

                </div>

              `
            )
            .join("")

          :

          '<div class="muted">주문 내역이 없습니다.</div>'
        }

      </div>

    `;


  document
    .querySelectorAll(
      ".delete-order-btn"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            deleteOrder(
              button.dataset.orderId
            );

          }
        );

      }
    );


  $("detailDialog").showModal();

}



function openOrderDialog() {

  const client =
    clients.find(
      item =>
        item.id === selectedClientId
    );


  if (!client) {

    return;

  }


  $("orderForm").reset();


  $("orderQty").value =
    1;


  $("orderPrice").value =
    0;


  $("orderDate").value =
    todayLocal();


  $("orderStatus").value =
    "진행중";


  $("productList").innerHTML =
    (client.products || [])
      .map(
        product =>
          `<option value="${escapeHtml(product.name)}"></option>`
      )
      .join("");


  $("orderDialog").showModal();

}



function applyProductPrice() {

  const client =
    clients.find(
      item =>
        item.id === selectedClientId
    );


  if (!client) {

    return;

  }


  const name =
    $("orderItem").value;


  const product =
    (client.products || [])
      .find(
        item =>
          item.name === name
      );


  if (product) {

    $("orderPrice").value =
      Number(
        product.price || 0
      );

  }

}



async function saveOrder(event) {

  event.preventDefault();


  if (!selectedClientId) {

    return;

  }


  const quantity =
    Number(
      $("orderQty").value
    );


  const price =
    Number(
      $("orderPrice").value || 0
    );


  const orderData = {

    client_id:
      selectedClientId,

    item_name:
      $("orderItem")
        .value
        .trim(),

    quantity:
      quantity,

    unit_price:
      price,

    total_amount:
      Number(
        (
          quantity *
          price
        ).toFixed(2)
      ),

    order_date:
      $("orderDate").value,

    status:
      $("orderStatus").value

  };


  try {

    const result =
      await db
        .from("orders")
        .insert(orderData);


    if (result.error) {

      throw result.error;

    }


    $("orderDialog").close();


    const clientId =
      selectedClientId;


    $("detailDialog").close();


    await loadData();


    openClientDetail(
      clientId
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "주문 저장 오류: " +
      (
        error.message ||
        String(error)
      )
    );

  }

}



async function deleteOrder(orderId) {

  if (
    !confirm(
      "이 주문을 삭제하시겠습니까?"
    )
  ) {

    return;

  }


  const clientId =
    selectedClientId;


  try {

    const result =
      await db
        .from("orders")
        .delete()
        .eq(
          "id",
          orderId
        );


    if (result.error) {

      throw result.error;

    }


    $("detailDialog").close();


    await loadData();


    openClientDetail(
      clientId
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "주문 삭제 오류: " +
      (
        error.message ||
        String(error)
      )
    );

  }

}



function exportCSV() {

  if (!clients.length) {

    alert(
      "내보낼 거래처 데이터가 없습니다."
    );

    return;

  }


  const rows = [

    [
      "거래처명",
      "국가",
      "담당자",
      "이메일",
      "전화번호",
      "판매물품목록",
      "거래상태",
      "주문건수",
      "메모"
    ],

    ...clients.map(
      client => [

        client.name,

        client.country,

        client.manager,

        client.email || "",

        client.phone || "",

        (client.products || [])
          .map(
            product =>
              `${product.name} ($${formatMoney(product.price)})`
          )
          .join("; "),

        statusText(
          client.status
        ),

        (client.orders || [])
          .length,

        client.notes || ""

      ]
    )

  ];


  const csv =
    "\uFEFF" +
    rows
      .map(
        row =>
          row
            .map(
              value =>
                `"${String(value ?? "")
                  .replaceAll(
                    '"',
                    '""'
                  )}"`
            )
            .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  link.href =
    url;


  link.download =
    `CAOS_CRM_${todayLocal()}.csv`;


  document.body
    .appendChild(link);


  link.click();


  link.remove();


  URL.revokeObjectURL(url);

}



function setupRealtime() {

  if (!db) {

    return;

  }


  let timer = null;


  const reloadSoon =
    () => {

      clearTimeout(timer);

      timer =
        setTimeout(
          () => {

            loadData();

          },
          300
        );

    };


  db
    .channel(
      "caos-crm-realtime"
    )

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "clients"
      },
      reloadSoon
    )

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "products"
      },
      reloadSoon
    )

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "orders"
      },
      reloadSoon
    )

    .subscribe();

}

startApp();
