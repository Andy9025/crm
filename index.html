<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CRM">
  <title>거래처 관리 CRM</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans KR", sans-serif;
      background: #f6f7f9;
      color: #172033;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .wrap {
      max-width: 1180px;
      margin: auto;
      padding: 18px;
    }

    .top {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 22px;
      margin: 0;
    }

    .sub {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: #e50012;
      color: white;
    }

    .secondary {
      background: white;
      border: 1px solid #d8dde6;
    }

    .danger {
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }

    .toolbar, .panel {
      background: white;
      border: 1px solid #e2e6ec;
      border-radius: 15px;
      margin-top: 15px;
      padding: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 8px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #ccd3dd;
      border-radius: 9px;
      padding: 10px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .statusline {
      font-size: 12px;
      margin-top: 10px;
      color: #64748b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .card {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
    }

    .card:hover {
      box-shadow: 0 5px 18px #00000010;
    }

    .card h3 {
      margin: 7px 0;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #eef2f7;
    }

    .ACTIVE {
      background: #ecfdf5;
      color: #047857;
    }

    .PROSPECT {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .INACTIVE {
      background: #f1f5f9;
      color: #64748b;
    }

    .products {
      font-size: 12px;
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 3px 0;
    }

    dialog {
      border: 0;
      border-radius: 17px;
      padding: 0;
      width: min(720px, 94vw);
      max-height: 92vh;
      box-shadow: 0 20px 70px #0004;
    }

    dialog::backdrop {
      background: #0007;
    }

    .modal {
      padding: 18px;
      overflow: auto;
      max-height: 92vh;
    }

    .modalhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modalhead h2 {
      margin: 0;
      font-size: 19px;
    }

    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full {
      grid-column: 1/-1;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .product-row {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 7px;
      margin-bottom: 7px;
    }

    .orders {
      margin-top: 15px;
    }

    .order {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      margin: 7px 0;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 45px;
    }

    @media(max-width:800px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar input {
        grid-column: 1/-1;
      }

      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(max-width:560px) {
      .wrap {
        padding: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .toolbar input {
        grid-column: auto;
      }

      .formgrid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div>
      <h1>거래처 관리 CRM</h1>
      <div class="sub">Supabase 실시간 중앙 데이터베이스</div>
    </div>

    <div>
      <button class="btn secondary" id="csvBtn">
        CSV 내보내기
      </button>

      <button class="btn primary" id="newBtn">
        + 신규 거래처
      </button>
    </div>

  </div>


  <div class="toolbar">

    <input
      id="search"
      placeholder="거래처명, 담당자, 이메일, 전화번호 검색"
    >

    <select id="countryFilter">
      <option value="">전체 국가</option>
    </select>

    <select id="statusFilter">
      <option value="">전체 상태</option>
      <option value="ACTIVE">활성 거래중</option>
      <option value="PROSPECT">계약 협상중</option>
      <option value="INACTIVE">거래 중단/휴면</option>
    </select>

    <button class="btn secondary" id="refreshBtn">
      새로고침
    </button>

  </div>


  <div class="statusline" id="statusLine">
    데이터 연결 중...
  </div>


  <div class="grid" id="cards"></div>

</div>


<!-- 거래처 등록/수정 -->

<dialog id="clientDialog">

<form class="modal" id="clientForm">

  <div class="modalhead">

    <h2 id="modalTitle">
      신규 거래처
    </h2>

    <button
      type="button"
      class="btn secondary"
      onclick="clientDialog.close()"
    >
      닫기
    </button>

  </div>


  <input
    type="hidden"
    id="clientId"
  >


  <div class="formgrid">

    <div>
      <label>거래처명 *</label>
      <input id="name" required>
    </div>

    <div>
      <label>국가 *</label>
      <input id="country" required>
    </div>

    <div>
      <label>담당자 *</label>
      <input id="manager" required>
    </div>

    <div>

      <label>상태</label>

      <select id="clientStatus">

        <option value="ACTIVE">
          활성 거래중
        </option>

        <option value="PROSPECT">
          계약 협상중
        </option>

        <option value="INACTIVE">
          거래 중단/휴면
        </option>

      </select>

    </div>


    <div>

      <label>이메일</label>

      <input
        id="email"
        type="email"
      >

    </div>


    <div>

      <label>전화번호</label>

      <input id="phone">

    </div>


    <div class="full">

      <label>메모</label>

      <textarea id="notes"></textarea>

    </div>


    <div class="full">

      <label>
        취급/판매 제품
      </label>

      <div id="productRows"></div>

      <button
        type="button"
        class="btn secondary"
        id="addProductBtn"
      >
        + 제품 추가
      </button>

    </div>

  </div>


  <div class="actions">

    <button
      type="button"
      class="btn danger"
      id="deleteClientBtn"
      style="margin-right:auto;display:none"
    >
      거래처 삭제
    </button>

    <button
      type="button"
      class="btn secondary"
      onclick="clientDialog.close()"
    >
      취소
    </button>

    <button
      class="btn primary"
      type="submit"
    >
      저장
    </button>

  </div>

</form>

</dialog>


<!-- 거래처 상세 -->

<dialog id="detailDialog">

<div class="modal">

  <div class="modalhead">

    <h2 id="detailTitle">
      거래처 상세
    </h2>

    <button
      class="btn secondary"
      onclick="detailDialog.close()"
    >
      닫기
    </button>

  </div>


  <div id="detailBody"></div>


  <div class="actions">

    <button
      class="btn secondary"
      id="editBtn"
    >
      거래처 수정
    </button>

    <button
      class="btn primary"
      id="newOrderBtn"
    >
      + 주문 등록
    </button>

  </div>

</div>

</dialog>


<!-- 주문 등록 -->

<dialog id="orderDialog">

<form class="modal" id="orderForm">

  <div class="modalhead">

    <h2>주문 등록</h2>

    <button
      type="button"
      class="btn secondary"
      onclick="orderDialog.close()"
    >
      닫기
    </button>

  </div>


  <div class="formgrid">

    <div class="full">

      <label>제품명 *</label>

      <input
        id="orderItem"
        required
        list="productList"
      >

      <datalist id="productList"></datalist>

    </div>


    <div>

      <label>수량 *</label>

      <input
        id="orderQty"
        type="number"
        min="1"
        value="1"
        required
      >

    </div>


    <div>

      <label>단가 ($)</label>

      <input
        id="orderPrice"
        type="number"
        min="0"
        step="0.01"
        value="0"
      >

    </div>


    <div>

      <label>주문일</label>

      <input
        id="orderDate"
        type="date"
        required
      >

    </div>


    <div>

      <label>상태</label>

      <select id="orderStatus">

        <option>진행중</option>
        <option>발송완료</option>
        <option>결제완료</option>

      </select>

    </div>

  </div>


  <div class="actions">

    <button
      type="button"
      class="btn secondary"
      onclick="orderDialog.close()"
    >
      취소
    </button>

    <button class="btn primary">
      주문 저장
    </button>

  </div>

</form>

</dialog>


<script>

const SUPABASE_URL =
"https://schiczeuqeclmhibpzwl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wCtIHl_y2y8drElaoK68qA__ofb6th6";


const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let clients = [];

let activeClient = null;


const $ =
id => document.getElementById(id);


const money =
n => Number(n || 0).toLocaleString(
  "en-US",
  {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }
);


const esc = s =>
String(s ?? "").replace(
  /[&<>"']/g,
  c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c])
);


const statusName = s => ({
  ACTIVE:"활성 거래중",
  PROSPECT:"계약 협상중",
  INACTIVE:"거래 중단/휴면"
}[s] || s);



async function loadData() {

  $("statusLine").textContent =
    "Supabase에서 데이터 불러오는 중...";


  const { data, error } =
  await db
    .from("clients")
    .select("*, products(*), orders(*)")
    .order("name");


  if (error) {

    $("statusLine").textContent =
      "연결 오류: " + error.message;

    console.error(error);

    return;
  }


  clients =
  (data || []).map(c => ({

    ...c,

    products:
      (c.products || [])
      .sort(
        (a,b) =>
        a.name.localeCompare(b.name)
      ),

    orders:
      (c.orders || [])
      .sort(
        (a,b) =>
        String(b.order_date)
        .localeCompare(
          String(a.order_date)
        )
      )

  }));


  $("statusLine").textContent =
    `연결됨 · 거래처 ${clients.length}개 · 마지막 갱신 ${new Date().toLocaleTimeString()}`;


  filters();

  render();
}



function filters() {

  const old =
    $("countryFilter").value;


  const cs =
  [...new Set(
    clients
      .map(c => c.country)
      .filter(Boolean)
  )].sort();


  $("countryFilter").innerHTML =
    '<option value="">전체 국가</option>' +

    cs.map(
      c =>
      `<option>${esc(c)}</option>`
    ).join("");


  if (cs.includes(old))
    $("countryFilter").value = old;

}



function render() {

  const q =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const country =
    $("countryFilter").value;


  const st =
    $("statusFilter").value;


  const list =
  clients.filter(c => {

    const hay = [

      c.name,
      c.country,
      c.manager,
      c.email,
      c.phone,
      c.notes,

      ...(c.products || [])
        .map(p => p.name)

    ].join(" ").toLowerCase();


    return (

      (!q || hay.includes(q))

      &&

      (!country ||
       c.country === country)

      &&

      (!st ||
       c.status === st)

    );

  });


  $("cards").innerHTML =

  list.length

  ?

  list.map(c => `

    <div
      class="card"
      data-id="${c.id}"
    >

      <div>

        <span class="badge">
          ${esc(c.country)}
        </span>

        <span
          class="badge ${c.status}"
        >
          ${statusName(c.status)}
        </span>

      </div>


      <h3>
        ${esc(c.name)}
      </h3>


      <div class="muted">

        ${esc(c.manager)}

        ·

        ${esc(c.phone || "-")}

      </div>


      <div class="products">

        ${
        (c.products || []).length

        ?

        (c.products || [])
        .map(
          p => `

          <div class="row">

            <span>
              ${esc(p.name)}
            </span>

            <b>
              $${money(p.price)}
            </b>

          </div>

        `).join("")

        :

        '등록 제품 없음'

        }

      </div>


      <div
        class="muted"
        style="margin-top:10px"
      >

        주문 ${(c.orders || []).length}건

      </div>

    </div>

  `).join("")

  :

  '<div class="panel empty" style="grid-column:1/-1">등록된 거래처가 없습니다.</div>';


  document
  .querySelectorAll(
    ".card[data-id]"
  )
  .forEach(

    el =>

    el.onclick =
    () =>
    openDetail(
      el.dataset.id
    )

  );

}



function addProductRow(
  name = "",
  price = ""
) {

  const d =
    document.createElement("div");


  d.className =
    "product-row";


  d.innerHTML = `

    <input
      class="pname"
      placeholder="제품명"
      value="${esc(name)}"
    >

    <input
      class="pprice"
      type="number"
      min="0"
      step="0.01"
      placeholder="단가"
      value="${esc(price)}"
    >

    <button
      type="button"
      class="btn danger"
    >
      삭제
    </button>

  `;


  d.querySelector("button")
   .onclick =
   () => d.remove();


  $("productRows")
    .appendChild(d);

}



function openNew() {

  activeClient = null;

  $("clientForm").reset();

  $("clientId").value = "";

  $("modalTitle").textContent =
    "신규 거래처 등록";

  $("clientStatus").value =
    "PROSPECT";

  $("productRows").innerHTML =
    "";

  addProductRow();

  $("deleteClientBtn").style.display =
    "none";

  clientDialog.showModal();

}



function openEdit(c) {

  activeClient = c;

  $("clientId").value = c.id;

  $("name").value = c.name;

  $("country").value = c.country;

  $("manager").value = c.manager;

  $("clientStatus").value = c.status;

  $("email").value = c.email || "";

  $("phone").value = c.phone || "";

  $("notes").value = c.notes || "";


  $("modalTitle").textContent =
    "거래처 수정";


  $("productRows").innerHTML =
    "";


  (c.products || [])
  .forEach(
    p =>
    addProductRow(
      p.name,
      p.price
    )
  );


  if (!(c.products || []).length)
    addProductRow();


  $("deleteClientBtn")
    .style.display = "block";


  clientDialog.showModal();

}



async function openDetail(id) {

  activeClient =
    clients.find(
      c => c.id === id
    );


  if (!activeClient)
    return;


  const c = activeClient;


  $("detailTitle").textContent =
    c.name;


  $("detailBody").innerHTML = `

    <div
      class="panel"
      style="margin-top:0"
    >

      <b>

        ${esc(c.country)}

        ·

        ${statusName(c.status)}

      </b>


      <p>

        ${esc(c.manager)}

        /

        ${esc(c.phone || "-")}

        /

        ${esc(c.email || "-")}

      </p>


      <p>
        ${esc(c.notes || "메모 없음")}
      </p>

    </div>


    <h3>
      취급 제품
    </h3>


    ${
    (c.products || [])
    .map(
      p => `

      <div class="row">

        <span>
          ${esc(p.name)}
        </span>

        <b>
          $${money(p.price)}
        </b>

      </div>

    `).join("")

    ||

    '<div class="muted">없음</div>'

    }


    <div class="orders">

      <h3>
        주문 내역
      </h3>


      ${
      (c.orders || [])
      .map(
        o => `

        <div class="order">

          <div class="row">

            <b>
              ${esc(o.item_name)}
            </b>

            <b>
              $${money(o.total_amount)}
            </b>

          </div>


          <div class="muted">

            ${esc(o.order_date)}

            ·

            ${o.quantity}개

            ×

            $${money(o.unit_price)}

            ·

            ${esc(o.status)}

          </div>


          <button
            class="btn danger del-order"
            data-id="${o.id}"
            style="margin-top:7px"
          >
            삭제
          </button>

        </div>

      `).join("")

      ||

      '<div class="muted">주문 내역 없음</div>'

      }

    </div>

  `;


  document
  .querySelectorAll(
    ".del-order"
  )
  .forEach(

    b =>

    b.onclick =
    () =>
    deleteOrder(
      b.dataset.id
    )

  );


  detailDialog.showModal();

}



$("clientForm").onsubmit =
async e => {

  e.preventDefault();


  const id =
    $("clientId").value;


  const payload = {

    name:
      $("name").value.trim(),

    country:
      $("country").value.trim(),

    manager:
      $("manager").value.trim(),

    status:
      $("clientStatus").value,

    email:
      $("email").value.trim(),

    phone:
      $("phone").value.trim(),

    notes:
      $("notes").value.trim()

  };


  let clientId = id;


  if (id) {

    const { error } =
    await db
      .from("clients")
      .update(payload)
      .eq("id", id);


    if (error)
      return alert(error.message);


    await db
      .from("products")
      .delete()
      .eq(
        "client_id",
        id
      );

  }

  else {

    const {
      data,
      error
    } =

    await db
      .from("clients")
      .insert(payload)
      .select()
      .single();


    if (error)
      return alert(error.message);


    clientId =
      data.id;

  }


  const ps =

  [...document
    .querySelectorAll(
      ".product-row"
    )]

  .map(
    r => ({

      name:
        r.querySelector(
          ".pname"
        ).value.trim(),

      price:
        Number(
          r.querySelector(
            ".pprice"
          ).value || 0
        )

    })
  )

  .filter(
    p => p.name
  )

  .map(
    p => ({
      ...p,
      client_id:clientId
    })
  );


  if (ps.length) {

    const { error } =
    await db
      .from("products")
      .insert(ps);


    if (error)
      return alert(error.message);

  }


  clientDialog.close();

  await loadData();

};



$("deleteClientBtn").onclick =
async () => {

  if (
    !activeClient ||
    !confirm(
      "이 거래처와 관련 제품/주문을 모두 삭제할까요?"
    )
  )
    return;


  const { error } =
  await db
    .from("clients")
    .delete()
    .eq(
      "id",
      activeClient.id
    );


  if (error)
    return alert(error.message);


  clientDialog.close();

  detailDialog.close();

  await loadData();

};



$("editBtn").onclick =
() => {

  detailDialog.close();

  openEdit(activeClient);

};



$("newOrderBtn").onclick =
() => {

  if (!activeClient)
    return;


  $("orderForm").reset();

  $("orderQty").value = 1;

  $("orderPrice").value = 0;

  $("orderDate").value =
    new Date()
      .toISOString()
      .slice(0,10);


  $("orderStatus").value =
    "진행중";


  $("productList").innerHTML =

    (activeClient.products || [])

    .map(
      p =>
      `<option value="${esc(p.name)}">`
    )

    .join("");


  orderDialog.showModal();

};



$("orderItem").onchange =
() => {

  const p =

  (activeClient?.products || [])

  .find(
    p =>
    p.name ===
    $("orderItem").value
  );


  if (p)
    $("orderPrice").value =
      p.price;

};



$("orderForm").onsubmit =
async e => {

  e.preventDefault();


  const qty =
    Number(
      $("orderQty").value
    );


  const price =
    Number(
      $("orderPrice").value || 0
    );


  const payload = {

    client_id:
      activeClient.id,

    item_name:
      $("orderItem")
        .value
        .trim(),

    quantity:
      qty,

    unit_price:
      price,

    total_amount:
      Number(
        (qty * price)
        .toFixed(2)
      ),

    order_date:
      $("orderDate").value,

    status:
      $("orderStatus").value

  };


  const { error } =
  await db
    .from("orders")
    .insert(payload);


  if (error)
    return alert(error.message);


  const clientId =
    activeClient.id;


  orderDialog.close();

  detailDialog.close();

  await loadData();

  openDetail(clientId);

};



async function deleteOrder(id) {

  if (
    !confirm(
      "이 주문을 삭제할까요?"
    )
  )
    return;


  const clientId =
    activeClient.id;


  const { error } =
  await db
    .from("orders")
    .delete()
    .eq("id", id);


  if (error)
    return alert(error.message);


  detailDialog.close();

  await loadData();

  openDetail(clientId);

}



$("newBtn").onclick =
  openNew;


$("addProductBtn").onclick =
() => addProductRow();


$("refreshBtn").onclick =
  loadData;


[
  "search",
  "countryFilter",
  "statusFilter"
]
.forEach(
  id =>
  $(id).addEventListener(
    id === "search"
      ? "input"
      : "change",
    render
  )
);



$("csvBtn").onclick =
() => {

  if (!clients.length)
    return alert(
      "내보낼 데이터가 없습니다."
    );


  const rows = [

    [
      "거래처명",
      "국가",
      "담당자",
      "이메일",
      "전화번호",
      "제품",
      "상태",
      "주문건수",
      "메모"
    ],


    ...clients.map(
      c => [

        c.name,
        c.country,
        c.manager,
        c.email,
        c.phone,

        (c.products || [])
        .map(
          p =>
          `${p.name}($${money(p.price)})`
        )
        .join("; "),

        statusName(c.status),

        (c.orders || []).length,

        c.notes

      ]
    )

  ];


  const csv =

  "\uFEFF" +

  rows.map(

    r =>

    r.map(
      v =>
      `"${String(v ?? "")
      .replaceAll(
        '"',
        '""'
      )}"`
    )
    .join(",")

  ).join("\n");


  const a =
    document.createElement("a");


  a.href =
    URL.createObjectURL(
      new Blob(
        [csv],
        {
          type:
          "text/csv;charset=utf-8"
        }
      )
    );


  a.download =
    `CRM_${new Date()
      .toISOString()
      .slice(0,10)}.csv`;


  a.click();


  URL.revokeObjectURL(
    a.href
  );

};



db
.channel("crm-live")

.on(
  "postgres_changes",

  {
    event:"*",
    schema:"public",
    table:"clients"
  },

  loadData
)

.on(
  "postgres_changes",

  {
    event:"*",
    schema:"public",
    table:"products"
  },

  loadData
)

.on(
  "postgres_changes",

  {
    event:"*",
    schema:"public",
    table:"orders"
  },

  loadData
)

.subscribe();



loadData();

</script>

</html>
